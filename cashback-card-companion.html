<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cashback Card Companion</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7a42c8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <style>
    :root{--purple:#7a42c8;--ink:#26164f;--line:#e7ddf2;--muted:#6b6b76}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffbe3;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(420px,calc(100vw - 32px));padding:28px;border:1px solid var(--line);border-radius:16px;background:white;box-shadow:0 18px 50px rgba(38,22,79,.14);text-align:center}
    .icon{font-size:42px;line-height:1;margin-bottom:12px}
    h1{margin:0;color:var(--purple);font-size:24px;line-height:1.15}
    p{margin:.65rem 0 1.2rem;color:var(--muted);font-size:15px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;background:var(--purple);color:white;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="icon">💳</div>
    <h1>Cashback Card Companion</h1>
    <p>Coming soon</p>
    <a href="./cloud/">Back to Appointment Companion</a>
  </main>
  <script src="pwa-register.js"></script>
</body>
</html>
