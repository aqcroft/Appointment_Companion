name: East Midlands default and specialist handoff v2.56.3
on:
  push:
    branches: [main]
    paths:
      - 'PWA/consolidated-v1/customer-region-v2.56.3.js'
      - 'PWA/consolidated-v1/consolidated-controller-v2.56.3.js'
      - 'PWA/consolidated-v1/should-i-fix/index.html'
      - 'PWA/consolidated-v1/ev/index.html'
      - 'PWA/consolidated-v1/index.html'
      - 'PWA/consolidated-v1/tests/region-default-v2.56.3.test.cjs'
      - '.github/workflows/region-default-v2563.yml'
  workflow_dispatch:
jobs:
  region_handoff:
    name: Browser test - Main, EV and Should I Fix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Run region-first customer and handoff test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/region-server.log 2>&1 &
          sleep 2
          timeout 170s node PWA/consolidated-v1/tests/region-default-v2.56.3.test.cjs
