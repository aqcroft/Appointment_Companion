name: Should I Fix approved forecast integration v2.66.17
on:
  pull_request:
    paths:
      - PWA/consolidated-v1/should-i-fix/index.html
      - PWA/consolidated-v1/tests/forecast-parity-v2.66.17.test.cjs
      - .github/workflows/sif-forecast-parity-v26617.yml
  push:
    branches: [main]
    paths:
      - PWA/consolidated-v1/should-i-fix/index.html
      - PWA/consolidated-v1/tests/forecast-parity-v2.66.17.test.cjs
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm iframe routing and shared scenario selections
        run: node --test PWA/consolidated-v1/tests/forecast-parity-v2.66.17.test.cjs
