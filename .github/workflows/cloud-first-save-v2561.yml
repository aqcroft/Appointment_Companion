name: Local-first and EV safe autosave v2.56.1
on:
  push:
    branches: [main]
    paths:
      - 'PWA/consolidated-v1/consolidated-controller-v2.56.0.js'
      - 'PWA/consolidated-v1/local-customer-store-v2.js'
      - 'PWA/consolidated-v1/ev-bridge-v2.56.1.js'
      - 'PWA/consolidated-v1/spring-clean-v2.js'
      - 'PWA/consolidated-v1/tests/cloud-first-save-v2.56.0.test.cjs'
      - 'PWA/consolidated-v1/tests/ev-autosave-v2.56.1.test.cjs'
      - 'PWA/consolidated-v1/ev/index.html'
      - 'PWA/consolidated-v1/index.html'
      - 'local-first/shell-pilot-v1.js'
      - '.github/workflows/cloud-first-save-v2561.yml'
  workflow_dispatch:
jobs:
  local_first_save:
    name: No premature Cloud profiles; EV autosave remains silent
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test first Cloud save and safe existing-record updates
        run: node PWA/consolidated-v1/tests/cloud-first-save-v2.56.0.test.cjs
      - name: Test EV autosave notifications and record reuse
        run: node PWA/consolidated-v1/tests/ev-autosave-v2.56.1.test.cjs
