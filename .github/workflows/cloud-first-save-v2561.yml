name: Local-first and EV safe autosave v2.56.2
# Legacy regression retained for manual review only.
# Automatic EV checking has moved to ev-current-regression.yml.
on:
  workflow_dispatch:

jobs:
  local_first_save:
    name: No premature Cloud profiles; EV autosave remains silent
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test first Cloud save and safe existing-record updates
        run: node PWA/consolidated-v1/tests/cloud-first-save-v2.56.0.test.cjs
      - name: Test EV autosave notifications and record reuse
        run: node PWA/consolidated-v1/tests/ev-autosave-v2.56.2.test.cjs
