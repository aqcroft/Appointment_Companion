name: Should I Fix unit-rate sharing v2.66.16
on:
  pull_request:
    paths:
      - PWA/consolidated-v1/fix-share-gate-v1.js
      - PWA/consolidated-v1/should-i-fix/index.html
      - PWA/consolidated-v1/tests/forecast-unit-share-v2.66.16.test.cjs
      - .github/workflows/forecast-unit-share-v26616.yml
  push:
    branches: ['feature/january-unit-rate-scenario-bridge-*', main]
    paths:
      - PWA/consolidated-v1/fix-share-gate-v1.js
      - PWA/consolidated-v1/should-i-fix/index.html
      - PWA/consolidated-v1/tests/forecast-unit-share-v2.66.16.test.cjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate share script syntax and scenario forwarding
        run: |
          node --check PWA/consolidated-v1/fix-share-gate-v1.js
          node --test PWA/consolidated-v1/tests/forecast-unit-share-v2.66.16.test.cjs
