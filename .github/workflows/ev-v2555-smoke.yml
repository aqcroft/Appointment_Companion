name: EV v2.55.5 E7 allowance and fuel mode smoke
on:
  push:
    branches: [main, fix/ev-e7-allowance-and-mode-polish-v2555-20261009]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test actual shared-link buttons in mobile Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ev-browser-server.log 2>&1 &
          sleep 2
          timeout 110s node tests/ev-v2555-smoke.cjs
          node tests/ev-v2555-e7-unit.cjs
          node tests/ev-v2553-share-unit.cjs
