name: EV smart customer journeys
on:
  push:
    branches:
      - main
      - feature/ev-smart-customer-journeys-20261101
    paths:
      - 'PWA/consolidated-v1/ev/index.html'
      - 'PWA/consolidated-v1/ev-onboarding-v2.67.0.js'
      - 'PWA/consolidated-v1/ev-onboarding-v2.68.0.js'
      - 'PWA/consolidated-v1/ev-guided-windowshop-v2.68.0.js'
      - 'PWA/consolidated-v1/ev-tradeoff-fuel-v2.68.0.js'
      - 'PWA/consolidated-v1/ev-sharing-v2.67.0.js'
      - 'PWA/consolidated-v1/ev-share-adapter-v2.67.0.js'
      - 'PWA/consolidated-v1/ev-next-steps-v2.67.0.js'
      - 'tests/ev-smart-journey.test.cjs'
      - '.github/workflows/ev-smart-journeys.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ev-smart:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check PWA/consolidated-v1/ev-onboarding-v2.67.0.js
          node --check PWA/consolidated-v1/ev-onboarding-v2.68.0.js
          node --check PWA/consolidated-v1/ev-guided-windowshop-v2.68.0.js
          node --check PWA/consolidated-v1/ev-tradeoff-fuel-v2.68.0.js
          node --check PWA/consolidated-v1/ev-sharing-v2.67.0.js
          node --check PWA/consolidated-v1/ev-share-adapter-v2.67.0.js
          node --check PWA/consolidated-v1/ev-next-steps-v2.67.0.js
          node --check tests/ev-smart-journey.test.cjs
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Browser regression tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ev-smart-server.log 2>&1 &
          sleep 2
          timeout 210s node tests/ev-smart-journey.test.cjs
