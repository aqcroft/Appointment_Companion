    function addEditorShareCard(doc,win){const old=doc.querySelector('section.card.share');if(old)old.style.display='none';if(doc.getElementById('sifEditorShareCard'))return;const card=doc.createElement('section');card.id='sifEditorShareCard';card.className='sif-integration-card';card.innerHTML='<div class="sif-share-head"><div><strong>Share</strong><div class="sif-share-help" style="margin-top:2px">Public tool or this personalised result</div></div><div class="sif-share-actions"><button type="button" class="sif-icon-btn" id="sifShareTool" title="Share public tool" aria-label="Share public tool">'+LINK_ICON+'</button><button type="button" class="sif-icon-btn primary" id="sifShareResult" title="Share personalised result" aria-label="Share personalised result">📤</button></div></div><div class="sif-name-row"><label for="sifCustomerName">Customer name <span style="font-weight:650">(optional)</span></label><input id="sifCustomerName" type="text" autocomplete="off" placeholder="e.g. Sarah"></div><div class="sif-share-help">🔗 shares the clean public tool. 📤 shares the name and scenario currently on screen.</div>';const fixed=doc.getElementById('fixedCard');fixed.parentNode.insertBefore(card,fixed.nextSibling);const name=appointmentName();if(name)card.querySelector('#sifCustomerName').value=name;card.querySelector('#sifShareTool').addEventListener('click',function(){copyOrShare('Should I Fix?','A simple way to explore whether fixing your energy could make sense.',basePublicUrl(),function(){toast(doc,'Public tool shared');});});card.querySelector('#sifShareResult').addEventListener('click',function(){const n=cleanName(card.querySelector('#sifCustomerName').value),url=personalisedUrl(doc,win);copyOrShare('Your Should I Fix? comparison',n?'Hi '+n+' - here is the energy comparison we looked at.':'Here is the energy comparison we looked at.',url,function(){toast(doc,'Personalised result shared');});});}

    function addPublicExperience(doc){doc.body.classList.add('sif-public');const old=doc.querySelector('section.card.share');if(old)old.style.display='none';const name=cleanName(params.get('n')),hero=doc.querySelector('header.hero');if(hero&&!doc.getElementById('sifPublicBanner')){const b=doc.createElement('div');b.id='sifPublicBanner';b.className='sif-public-banner';b.textContent=name?'Personalised comparison for '+name:'Public Should I Fix? explorer';hero.insertAdjacentElement('afterend',b);}if(!doc.getElementById('sifPublicShare')){const card=doc.createElement('section');card.id='sifPublicShare';card.className='sif-integration-card';card.innerHTML='<div class="sif-share-head" style="margin-bottom:0"><div><strong>Useful? Pass it on.</strong><div class="sif-share-help" style="margin-top:2px">Shares a fresh copy with no personal data.</div></div><button type="button" class="sif-icon-btn" id="sifPublicShareBtn" title="Share this tool" aria-label="Share this tool">'+LINK_ICON+'</button></div>';const result=doc.getElementById('resultCard');result.parentNode.insertBefore(card,result.nextSibling);card.querySelector('#sifPublicShareBtn').addEventListener('click',function(){copyOrShare('Should I Fix?','A simple way to explore whether fixing your energy could make sense.',basePublicUrl(),function(){toast(doc,'Fresh public tool shared');});});}if(!doc.getElementById('sifConversion')){const card=doc.createElement('section');card.id='sifConversion';card.className='sif-conversion';const basket=safeUrl(params.get('b'));card.innerHTML='<h2>Want to explore your actual UW options?</h2><p>Use whichever route feels easiest.</p>'+(basket?'<a class="sif-cta" href="'+basket.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">Open your UW basket →</a>':'')+'<a class="sif-cta" href="'+PROFILE.whatsapp+'" target="_blank" rel="noopener">'+WHATSAPP_ICON+'<span>Drop me a WhatsApp</span></a><a class="sif-cta secondary" href="'+PROFILE.quote+'" target="_blank" rel="noopener">Get a personalised UW quote →</a><a class="sif-cta secondary" href="'+PROFILE.booking+'" target="_blank" rel="noopener">🗓️ Book a chat</a><div class="sif-partner">Adrian Croft - UW Authorised Partner · <a href="'+PROFILE.site+'" target="_blank" rel="noopener">AQCroft.com</a></div>';const details=doc.querySelector('details');details.parentNode.insertBefore(card,details);}}

    function applyAppointmentUsage(doc){if(publicMode)return;const i=appointmentInputs(),elec=Math.max(0,Number(i.electricityUsageKwh)||0),gas=Math.max(0,Number(i.gasUsageKwh)||0),hasElec=asBool(i.energyHasElectricity,true),hasGas=asBool(i.energyHasGas,true),hasPersonal=elec>0||gas>0;const mode=hasElec&&hasGas?'dual':hasGas?'gas':'elec',fuel=doc.querySelector('#fuelSeg button[data-mode="'+mode+'"]');if(fuel)fuel.click();if(hasPersonal){const custom=doc.getElementById('btnPersonal');if(custom)custom.click();const e=doc.getElementById('elec'),g=doc.getElementById('gas');if(e&&elec>0)e.value=String(Math.round(elec));if(g&&gas>0)g.value=String(Math.round(gas));[e,g].forEach(function(el){if(!el)return;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));});note.textContent='Using appointment usage';}else note.textContent='No saved usage - using calculator presets';}
    function onFrameReady(){let doc,win;try{doc=frame.contentDocument||frame.contentWindow.document;win=frame.contentWindow;}catch(_){return;}if(!doc||!win)return;injectStyles(doc);installStressEngine(doc,win);applyAppointmentUsage(doc);addProfile(doc);if(publicMode)addPublicExperience(doc);else addEditorShareCard(doc,win);if(publicMode&&params.has('sp')){win.__sifStressPct=Number(params.get('sp'))||0;const stress=doc.getElementById('stress');if(stress){stress.checked=false;stress.dispatchEvent(new Event('input',{bubbles:true}));}setTimeout(function(){doc.querySelectorAll('.sif-stress-btn').forEach(function(b){b.classList.toggle('on',Math.abs(Number(b.dataset.stress)-win.__sifStressPct)<.01);});patchForecastLabel(doc,win.__sifStressPct);},30);}}
    frame.addEventListener('load',function(){setTimeout(onFrameReady,70);setTimeout(onFrameReady,400);});
    document.getElementById('backBtn').addEventListener('click',function(){if(bridge&&envelope&&typeof bridge.returnToOrigin==='function'){bridge.returnToOrigin({tool_state:{opened_at:new Date().toISOString()}});return;}history.back();});
  })();
  </script>
