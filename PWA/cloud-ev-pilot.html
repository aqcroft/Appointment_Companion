<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EV Companion Cloud Pilot</title>
  <meta name="robots" content="noindex">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffbe3;color:#26164f;margin:0;display:grid;place-items:center;min-height:100vh}
    .msg{padding:24px;text-align:center}
  </style>
</head>
<body>
  <div class="msg" id="loader">🚙 Opening EV Companion…</div>
  <script>
  (async function(){
    try {
      const assetVersion = '20260910-feedback1';
      const response = await fetch('./v16c-ev.html?v=' + assetVersion);
      if (!response.ok) throw new Error('EV source returned HTTP ' + response.status);
      let html = await response.text();
      const inject = '<script>document.body.dataset.companionTool="ev";<\/script><script src="./cloud-client-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud/device-identity-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud/companion-bridge-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud/specialist-cloud-save-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud/specialist-share-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud/ev-bridge-pilot-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud/ev-cloud-share-v1.js?v=' + assetVersion + '"><\/script>';
      if (!/<\/body>/i.test(html)) throw new Error('EV source has no closing body tag.');
      html = html.replace(/<\/body>/i, inject + '</body>');
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      document.getElementById('loader').textContent = '❌ EV Cloud pilot could not load: ' + (err && err.message ? err.message : String(err));
    }
  })();
  </script>
</body>
</html>
