<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Appointment Companion v2.1</title>
  <meta name="description" content="Appointment Companion local-first PWA">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7a42c8">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../app-icon.svg" type="image/svg+xml">
  <style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffbe3;color:#26164f;margin:0;display:grid;place-items:center;min-height:100vh}.msg{padding:24px;text-align:center}</style>
</head>
<body>
  <div class="msg" id="loader">🔄 Opening Appointment Companion…</div>
  <script>
  (async function () {
    try {
      var version = '20260911-v2.1';
      var localOnly = new URL(location.href).searchParams.get('local') === '1';
      var response = await fetch('../cloud/companion_cloud_pilot.html?v=' + version);
      if (!response.ok) throw new Error('Cloud UI donor returned HTTP ' + response.status);
      var html = await response.text();
      if (!/<\/body>/i.test(html)) throw new Error('Cloud UI donor is incomplete.');
      var head = '<head><base href="../cloud/"><script>window.__AC_LOCAL_FIRST=true;window.__AC_CONSOLIDATED_V1=true;window.__AC_LOCAL_ONLY=' + (localOnly ? 'true' : 'false') + ';<\/script><script src="../consolidated-v1/tariff-fetch-v1.js?v=' + version + '"><\/script>';
      html = html.replace(/<head>/i, head);
      html = html.replace(/<script src="\.\.\/pwa-register\.js"><\/script>/i, '<script src="../consolidated-v1/pwa-register.js?v=' + version + '"><\/script>');
      var inject =
        '<script src="../../cloud-client-v1.js?v=' + version + '"><\/script>' +
        '<script src="./device-identity-v1.js?v=' + version + '"><\/script>' +
        '<script src="./companion-bridge-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/canonical-state-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/local-customer-store-v2.js?v=' + version + '"><\/script>' +
        '<script src="../../local-first/shell-pilot-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/share-policy-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/specialist-share-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/canonical-controls-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/service-ui-polish-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/specialist-launcher-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/specialist-features-v1.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/spring-clean-v2.js?v=' + version + '"><\/script>' +
        '<script src="../consolidated-v1/consolidated-controller-v1.js?v=' + version + '"><\/script>';
      html = html.replace(/<\/body>/i, inject + '</body>');
      document.open(); document.write(html); document.close();
    } catch (error) {
      document.getElementById('loader').textContent = '❌ Appointment Companion could not load: ' + ((error && error.message) || String(error));
    }
  })();
  </script>
</body>
</html>
