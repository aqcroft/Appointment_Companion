<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Should I Fix?</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7a42c8">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffbe3;color:#26164f;margin:0;display:grid;place-items:center;min-height:100vh}
    .msg{padding:24px;text-align:center}
  </style>
</head>
<body>
  <div class="msg" id="loader">📈 Loading Should I Fix…</div>
  <script>
  (async function(){
    try{
      const v='20260911-live1';
      const r=await fetch('../cloud-test/should-i-fix-pilot-v2.html?v='+v,{cache:'no-store'});
      if(!r.ok) throw new Error('Should I Fix source returned HTTP '+r.status);
      const html=await r.text();
      if(!/<\/body>/i.test(html)) throw new Error('Should I Fix source is incomplete.');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      document.getElementById('loader').textContent='❌ Should I Fix could not load: '+(err&&err.message?err.message:String(err));
    }
  })();
  </script>
</body>
</html>
