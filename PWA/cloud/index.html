<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Appointment Companion Cloud Pilot</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7a42c8">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../app-icon.svg" type="image/svg+xml">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffbe3;color:#26164f;margin:0;display:grid;place-items:center;min-height:100vh}
    .msg{padding:24px;text-align:center}
  </style>
</head>
<body>
  <div class="msg" id="loader">☁️ Loading Appointment Companion Cloud pilot…</div>
  <script>
  (async function(){
    try {
      const assetVersion = '20260911-fix1';
      const response = await fetch('./companion_cloud_pilot.html?v=' + assetVersion);
      if (!response.ok) throw new Error('Pilot source returned HTTP ' + response.status);
      let html = await response.text();
      const inject = '<script src="../cloud-client-v1.js?v=' + assetVersion + '"><\/script><script src="./device-identity-v1.js?v=' + assetVersion + '"><\/script><script src="./companion-bridge-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud-pilot-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud-pilot-enhancements-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud-pilot-safety-v1.js?v=' + assetVersion + '"><\/script><script src="./cloud-presence-v1.js?v=' + assetVersion + '"><\/script><script src="./specialist-launcher-v1.js?v=' + assetVersion + '"><\/script><script src="./specialists-v1.js?v=' + assetVersion + '"><\/script><script src="./should-i-fix-integration-v1.js?v=' + assetVersion + '"><\/script>';
      if (!/<\/body>/i.test(html)) throw new Error('Pilot source has no closing body tag.');
      html = html.replace(/<\/body>/i, inject + '</body>');
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      document.getElementById('loader').textContent = '❌ Cloud pilot could not load: ' + (err && err.message ? err.message : String(err));
    }
  })();
  </script>
</body>
</html>
