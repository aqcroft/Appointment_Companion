<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UW EV Tariff Companion</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7a42c8">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../app-icon.svg" type="image/svg+xml">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffbe3;color:#26164f;margin:0;display:grid;place-items:center;min-height:100vh}
    .msg{padding:24px;text-align:center}
  </style>
</head>
<body>
  <div class="msg" id="loader">🚙 Loading your EV Companion…</div>
  <script>
  (async function(){
    try {
      const shareToken = new URL(location.href).searchParams.get('s') || '';
      const response = await fetch('../../v16c-ev.html', { cache: 'no-store' });
      if (!response.ok) throw new Error('EV Companion returned HTTP ' + response.status);
      let html = await response.text();

      if (!/<head>/i.test(html) || !/<body>/i.test(html) || !/<\/body>/i.test(html)) {
        throw new Error('EV Companion source is incomplete.');
      }

      html = html.replace(/<head>/i, '<head><base href="../../"><style>#shareSetup{display:none!important}</style>');
      if (shareToken) {
        html = html.replace(/<body([^>]*)>/i, '<body$1><div id="cloudShareBlocker" style="position:fixed;inset:0;z-index:99998;background:#fffbe3;display:grid;place-items:center;padding:24px;font:600 15px/1.45 system-ui,-apple-system,\"Segoe UI\",sans-serif;color:#26164f;text-align:center;"><div><div style="font-size:34px;margin-bottom:10px;">🚙</div><div>Loading your personalised EV Companion…</div><div style="font-size:11px;font-weight:500;opacity:.7;margin-top:6px;">Checking the saved figures and latest tariff data</div></div></div>');
        html = html.replace(
          /<script src="v16c-sharing\.js"><\/script>/i,
          '<script src="cloud-client-v1.js"><\/script><script src="cloud/specialist-share-v1.js"><\/script><script src="v16c-sharing.js"><\/script><script src="companion/ev/share-view-v1.js"><\/script>'
        );
      } else {
        const draftInject = '<script>document.body.dataset.companionTool="ev";<\/script><script src="cloud-client-v1.js"><\/script><script src="cloud/device-identity-v1.js"><\/script><script src="cloud/companion-bridge-v1.js"><\/script><script src="cloud/specialist-cloud-save-v1.js"><\/script><script src="cloud/specialist-share-v1.js"><\/script><script src="cloud/ev-bridge-pilot-v1.js"><\/script><script src="cloud/ev-cloud-share-v1.js"><\/script>';
        html = html.replace(/<\/body>/i, draftInject + '</body>');
      }

      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      document.getElementById('loader').textContent = '❌ EV Companion could not load: ' + (err && err.message ? err.message : String(err));
    }
  })();
  </script>
</body>
</html>
